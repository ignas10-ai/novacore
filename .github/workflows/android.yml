# Debug APK for testers:
# GitHub -> Releases -> latest Debug Build
# Obtainium can monitor the GitHub Releases page.
#
# Release AAB for Google Play:
# GitHub -> Actions -> run -> Artifacts -> novacore-release-aab

name: Android APK

on:
  push:
    branches: [master, android]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest

    env:
      # Read by android/app/build.gradle (versionCode / versionName).
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - run: npx cap sync android

      # Use the same debug signing key on every build, otherwise Android
      # refuses to update the installed app (signature mismatch).
      - name: Restore stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: android

      # ---------- Debug APK (testers) ----------
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # Keep an Actions artifact as well.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: novacore-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---------- Release AAB (Google Play) ----------
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # Not published to GitHub Releases on purpose: the AAB is for Play only.
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: novacore-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # ---------- Publish debug APK to GitHub Releases ----------
      # A new release is created for every successful workflow run.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Debug Build ${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
