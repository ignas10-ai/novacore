# Debug APK for testers: GitHub -> Actions -> latest "Android APK" run -> Artifacts -> novacore-debug-apk
name: Android APK

on:
  push:
    branches: [master, android]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm test needs >= 22.18 (type stripping + require(esm)); Vercel builds on 24.x too
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 / AGP 8.13 compile with Java 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: novacore-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
