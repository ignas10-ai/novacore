<!doctype html><html lang="lt"><head><meta charset="utf-8"><title>NovaCore – landmark extract</title></head>
<body style="background:#111;color:#eee;font:14px monospace">
<!-- ponytail: paleidžiama tik per tools/extract.cjs (headless Chrome). Vaizdo įrašas → MediaPipe Pose (tas pats modelis kaip index.html) → landmark'ų JSON. -->
<video id="v" muted playsinline style="max-width:480px"></video>
<pre id="log"></pre>
<script type="module">
import {PoseLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const q=new URLSearchParams(location.search);
const src=q.get("src"), stepMs=+(q.get("step")||33), numPoses=+(q.get("poses")||1);
const log=m=>{document.getElementById("log").textContent+=m+"\n"};
window.__result=null;
(async()=>{
  try{
    const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    let lm;
    try{lm=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},runningMode:"VIDEO",numPoses})}
    catch(e){log("GPU fail → CPU: "+e.message);lm=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"CPU"},runningMode:"VIDEO",numPoses})}
    const v=document.getElementById("v");
    v.src=src;
    await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(new Error("video load fail "+src))});
    const frames=[];
    const seek=t=>new Promise(r=>{v.onseeked=()=>r();v.currentTime=t});
    // ponytail: seek'inam kadrą po kadro, ne play() – deterministiška ir nepriklauso nuo headless greičio
    for(let t=0;t<v.duration;t+=stepMs/1000){
      await seek(t);
      const r=lm.detectForVideo(v,Math.round(t*1000));
      // [x, y, visibility, z] – z normalizuotas kaip x (gylis nuo klubų), reikalingas 3D kelio kampui
      const people=(r.landmarks||[]).map(p=>p.map(k=>[+k.x.toFixed(4),+k.y.toFixed(4),+(k.visibility??1).toFixed(3),+(k.z??0).toFixed(4)]));
      frames.push({t:+t.toFixed(3),p:people});
    }
    window.__result={src,w:v.videoWidth,h:v.videoHeight,duration:v.duration,stepMs,frames};
    log("done "+frames.length+" frames");
  }catch(e){window.__result={error:String(e&&e.stack||e)};log("ERR "+e)}
})();
</script></body></html>
