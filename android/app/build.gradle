apply plugin: 'com.android.application'

// appId / appName live only in capacitor.config.json (repo root); the launcher label and package come from there
def capConfig = new groovy.json.JsonSlurper().parse(rootProject.file('../capacitor.config.json'))

// CI passes github.run_number as VERSION_CODE; local builds fall back to 1.
def ciVersionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()

// Release signing comes from env vars set by the CI workflow. Locally (no env) the release build stays unsigned.
def releaseKeystorePath = System.getenv("RELEASE_KEYSTORE_PATH")

android {
    namespace = "lt.novacore.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId capConfig.appId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ciVersionCode
        versionName "1.0.${ciVersionCode}"
        resValue "string", "app_name", capConfig.appName
        resValue "string", "title_activity_main", capConfig.appName
        resValue "string", "package_name", capConfig.appId
        resValue "string", "custom_url_scheme", capConfig.appId
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // A fixed debug key (public, password "android"): CI runners would otherwise sign every APK with a fresh
    // random key and testers could not install a newer APK over the old one. Not for Play Store releases.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Private upload key for Google Play, injected by CI from GitHub Secrets. Never commit it.
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
